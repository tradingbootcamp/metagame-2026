name: Vercel Preview

# Vercel's Git integration only builds a commit whose author is a paid member of
# the Vercel team, so PRs from contributors never produced a preview (free
# Viewer seats don't deploy either). Building and deploying from Actions
# attributes the deployment to VERCEL_TOKEN's owner instead of the commit
# author, which skips the membership check. Same setup as the arbiter repo.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Not secrets: the org and project ids grant nothing on their own —
  # VERCEL_TOKEN is the credential.
  VERCEL_ORG_ID: team_xZ04n0kgLIeWN2bNut9vNgyC
  VERCEL_PROJECT_ID: prj_dZK9DZ5ExKSLnDLZZkK2vtKURLRx
  HEAD_REF: ${{ github.event.pull_request.head.ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  preview:
    name: Preview
    # Fork PRs are excluded deliberately: secrets aren't exposed to them, and a
    # workflow rigged to expose VERCEL_TOKEN to fork code would hand the token
    # to anyone who opens a PR. Contributors push branches to this repo.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # Without this the CLI fails later with `You defined "--token",
      # but it's missing a value`, which doesn't point at the repo secret.
      - name: Check for the Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repo secret is not set."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the PR head, not the synthetic merge commit, so the preview
          # matches what the Git integration used to deploy.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Vercel project's Node version.
          node-version: "24"
          cache: "pnpm"

      - name: Install Vercel CLI
        run: npm install --global vercel@59.5.0

      - name: Pull project settings and preview env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --git-branch="$HEAD_REF" --token="$VERCEL_TOKEN"

      # Runs the branch's own install scripts and config, so this is the step
      # where repo code executes. VERCEL_TOKEN is deliberately absent here:
      # `vercel build` only needs the settings `vercel pull` wrote to .vercel/,
      # and keeping the token out means a malicious postinstall can't read it.
      - name: Build
        run: vercel build

      - name: Deploy
        id: deploy
        # `shell: bash` for pipefail — the default `bash -e` takes the pipeline's
        # status from `tail`, so a failed deploy would pass the step and post an
        # empty link.
        shell: bash
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
            --meta githubCommitRef="$HEAD_REF" \
            --meta githubCommitSha="$HEAD_SHA" \
            --meta githubPrId="$PR_NUMBER" | tail -n1)
          if [ -z "$url" ]; then
            echo "::error::vercel deploy produced no URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Replaces the Vercel bot's PR comment, which only appears for Git
      # integration deployments. One sticky comment, edited in place.
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker="<!-- vercel-preview -->"
          body=$(printf '%s\n**Preview:** %s\n\n<sub>Built from %s by GitHub Actions.</sub>' \
            "$marker" "$URL" "${HEAD_SHA:0:7}")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
