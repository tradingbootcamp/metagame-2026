# Wipes the shared dev database (the Neon `dev` branch that previews use) and
# rebuilds it from the migrations on the chosen ref plus the seed script.
# Run it from the Actions tab whenever dev's schema or data has drifted.
name: Reset dev DB

on:
  workflow_dispatch:

concurrency: dev-db

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset --yes
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
